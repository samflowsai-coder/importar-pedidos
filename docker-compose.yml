services:
  app:
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      # O serviço worker abaixo já drena a fila do FlowPCP e lê as decisões;
      # a thread do processo web (feita para o Windows, onde só o ui.py roda)
      # faria o mesmo trabalho em dobro.
      PORTAL_FLOWPCP_ENVIO: "0"
    ports:
      - "8000:8000"
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
      - ./logs:/app/logs

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    volumes:
      - ./output:/app/output   # shared host-mount — both services access the same app_state.db
      - ./logs:/app/logs
    depends_on:
      - app
    restart: on-failure
