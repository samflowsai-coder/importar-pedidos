name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo ref cancela o run anterior. Sem isso, dois pushes
# seguidos num PR pagam a suite duas vezes e o resultado do primeiro e' lixo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # A diferenca de 24min ja foi explicada e corrigida: FB_HOST vazava entre
    # testes e o Linux esperava os SYN retries (~127s por chamada) -- ver PR #50
    # e tests/test_env_leak_guard.py. O job fecha em ~90s hoje, entao o teto
    # deixa de ser rede frouxa e vira alarme: passou de 10min, tem regressao.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      # --durations=25 fica permanente: foi o que nomeou os 9 testes que
      # concentravam 96% do tempo. Sem ele o runner volta a ser caixa-preta e a
      # proxima regressao passa despercebida, com a suite verde.
      - name: Tests
        run: pytest -q --durations=25
